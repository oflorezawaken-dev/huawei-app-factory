# XcodeGen source of truth. The .xcodeproj is generated, never committed:
# a .pbxproj is unreviewable and conflicts on every merge.
name: PriceJar
options:
  bundleIdPrefix: com.proapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Xcode leaves PRODUCT_NAME empty unless something sets it, and three
    # targets producing ".app" collide with "Multiple commands produce".
    PRODUCT_NAME: $(TARGET_NAME)
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Debug:
      # @testable import needs this; XcodeGen does not add it on its own here.
      ENABLE_TESTABILITY: YES
    Release:
      ENABLE_TESTABILITY: NO

targets:
  PriceJar:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Info.plist]
    configFiles:
      Debug: Config/AdMob.xcconfig
      Release: Config/AdMob.xcconfig
    dependencies:
      - package: GoogleMobileAds
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PriceJarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        # Without BUNDLE_LOADER the test bundle does not link against the host
        # binary and every app symbol comes back undefined.
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: PriceJar

  PriceJarScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources: [ScreenshotTests]
    dependencies:
      - target: PriceJar

schemes:
  PriceJar:
    build:
      targets:
        PriceJar: all
        PriceJarTests: [test]
    test:
      targets: [PriceJarTests]
      gatherCoverageData: true
  PriceJarScreenshots:
    build:
      targets:
        PriceJar: all
        PriceJarScreenshots: [test]
    test:
      targets: [PriceJarScreenshots]
