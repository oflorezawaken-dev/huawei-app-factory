# XcodeGen source of truth. The .xcodeproj is generated, never committed:
# a .pbxproj is unreviewable and conflicts on every merge.
name: AppTemplate
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Xcode leaves PRODUCT_NAME empty unless something sets it, and three
    # targets producing ".app" collide with "Multiple commands produce".
    PRODUCT_NAME: $(TARGET_NAME)
    # 1,2 = iPhone and iPad. Set explicitly rather than left to Xcode's
    # default so it stays in step with the spec's technical.devices, which
    # check_ios_app.py's device_family rule enforces. Declaring iPad means
    # Apple requires 13-inch iPad screenshots and will review the iPad
    # layout, so both are part of the flow rather than an afterthought.

    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Debug:
      # @testable import needs this; XcodeGen does not add it on its own here.
      ENABLE_TESTABILITY: YES
    Release:
      ENABLE_TESTABILITY: NO

targets:
  AppTemplate:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: [Info.plist]
    configFiles:
      Debug: Config/AdMob.xcconfig
      Release: Config/AdMob.xcconfig
    dependencies:
      - package: GoogleMobileAds
    settings:
      base:
        # On the TARGET, not only on the project. XcodeGen 2.46 lets the target's
        # universal default win over a project-level value -- measured: project-level
        # "1" resolves to 1,2 under 2.46 and to 1 under 2.42. An iPhone-only app
        # generated from this template must set "1" HERE, or it ships universal and
        # Apple demands iPad screenshots for a layout it does not have.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AppTemplateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        # Without BUNDLE_LOADER the test bundle does not link against the host
        # binary and every app symbol comes back undefined.
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: AppTemplate

  AppTemplateScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources: [ScreenshotTests]
    dependencies:
      - target: AppTemplate

schemes:
  AppTemplate:
    build:
      targets:
        AppTemplate: all
        AppTemplateTests: [test]
    test:
      targets: [AppTemplateTests]
      gatherCoverageData: true
  AppTemplateScreenshots:
    build:
      targets:
        AppTemplate: all
        AppTemplateScreenshots: [test]
    test:
      targets: [AppTemplateScreenshots]
