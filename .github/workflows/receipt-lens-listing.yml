name: ReceiptLens Update Store Listing

# Pushes app name / short description / full description / release notes to
# AppGallery Connect for one or all languages in store/listing.json. Manual
# trigger only, using the same `appgallery` environment (and secrets) as the
# publish workflow.

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language code to push (e.g. en-US). Leave empty to push every language in listing.json'
        required: false
        default: ''
      dry_run:
        description: 'Print what would be sent without calling AppGallery Connect'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  update-listing:
    runs-on: ubuntu-latest
    environment: appgallery
    env:
      LISTING_FILE: apps/receipt-lens/store/listing.json
      APP_ID: ${{ vars.RECEIPT_LENS_AGC_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push listing
        env:
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          LANG_INPUT: ${{ inputs.lang }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_ID" ]]; then
            echo "::error::Repository variable RECEIPT_LENS_AGC_APP_ID is not set."
            exit 1
          fi
          args=(--app-id "$APP_ID" --listing "$LISTING_FILE")
          if [[ -n "$LANG_INPUT" ]]; then
            args+=(--lang "$LANG_INPUT")
          else
            args+=(--all)
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 factory/tools/agc_update_listing.py "${args[@]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## AppGallery store listing update"
            echo ""
            echo "- Language(s): ${{ inputs.lang != '' && inputs.lang || 'all (listing.json)' }}"
            echo "- Dry run: ${{ inputs.dry_run }}"
          } >> "$GITHUB_STEP_SUMMARY"
