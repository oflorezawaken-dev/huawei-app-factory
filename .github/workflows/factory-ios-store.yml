name: Factory iOS Store Setup

# Pushes store metadata and screenshots for a registered iOS app to App Store
# Connect: name/subtitle/privacy URL (appInfoLocalizations), description/
# keywords/promotional text/support URL/what's new (appStoreVersionLocalizations),
# and screenshots (App Store Connect Media API). All locales in listing.json
# are pushed together; there is no per-locale filter, since redoing every
# locale is cheap. Manual trigger, `appstore` environment (read/write, but no
# binary is uploaded here -- that is factory-ios-publish.yml's job).
#
# `setup` (also part of `all`) creates the appStoreVersion for the registry's
# marketing version and the Remove Ads in-app purchase -- localizations, price,
# availability and the review screenshot -- idempotently, via asc_setup.py.
# Those used to be console clicks, and an incomplete purchase was two of
# PriceJar's three rejections. Text and screenshots then need that version to
# exist in an editable state (PREPARE_FOR_SUBMISSION, *_REJECTED).

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'iOS app slug from factory/apps.json'
        required: true
      what:
        description: 'What to push'
        required: true
        default: 'all'
        type: choice
        options: [all, setup, text, screenshots]
      dry_run:
        description: 'Print what would be sent without calling App Store Connect'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Ad unit IDs live in repository variables, never in git (factory rule 5).
  # Workflow-level, not per step: registry.py resolves them when it writes
  # the environment, and check_ios_app.py resolves them again for itself --
  # setting this on only the first step left the quality gate blind and it
  # failed shift-slip for ad IDs that were configured all along.
  FACTORY_VARS: ${{ toJSON(vars) }}

jobs:
  store:
    runs-on: ubuntu-latest
    environment: appstore
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
    steps:
      # This repository is public, and GitHub does not mask repository
      # *variables* the way it masks secrets. Every `run` step prints the
      # environment in scope, so the workflow-level FACTORY_VARS put the
      # production AdMob unit IDs in plain text in the public log of every
      # step of every run. They are also extractable from the shipped IPA, so
      # this is not a disclosure of something otherwise unknowable -- but a
      # public log makes them greppable, and the concrete risk is invalid
      # traffic aimed at those units, which is how an AdMob account gets
      # flagged. Register them as masks before any other step runs.
      #
      # Known limit: this step's OWN environment block is printed before its
      # script executes, so one echo per job survives. Closing that last one
      # means moving the values from repository variables to repository
      # secrets, which GitHub masks on its own. Documented in
      # docs/IOS_FIRST_RUN_RETROSPECTIVE.md; not done here because it needs
      # the owner to re-create them by hand.
      - name: Mask the ad IDs so the rest of the job cannot print them
        run: |
          set -euo pipefail
          python3 - <<'MASK'
          import json, os
          masked = 0
          for key, value in json.loads(os.environ.get("FACTORY_VARS") or "{}").items():
              value = str(value).strip()
              # Anything shorter than 8 characters is not an identifier, and
              # masking a value like "1" would redact half the log.
              if len(value) >= 8:
                  print(f"::add-mask::{value}")
                  masked += 1
          print(f"masked {masked} repository variable value(s) for this job")
          MASK
      - uses: actions/checkout@v4

      - name: Load app from registry
        run: |
          set -euo pipefail
          python3 factory/tools/registry.py env "${{ inputs.app }}" >> "$GITHUB_ENV"
          if [[ -z "$(python3 factory/tools/registry.py get "${{ inputs.app }}" asc_app_id)" ]]; then
            echo "::error::factory/apps.json has no asc_app_id for ${{ inputs.app }}. Create the app in App Store Connect and paste its numeric Apple ID into the registry."
            exit 1
          fi

      - name: Confirm signing credentials are configured
        run: |
          [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY_P8" ]] || {
            echo "::error::ASC_KEY_ID/ASC_ISSUER_ID/ASC_PRIVATE_KEY_P8 are not configured in the appstore environment."
            exit 1
          }

      - name: Create version and in-app purchase
        if: inputs.what == 'setup' || inputs.what == 'all'
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=("$APP_SLUG" --what all)
          [[ "$DRY" == "true" ]] && args+=(--dry-run)
          python3 factory/tools/asc_setup.py "${args[@]}"

      - name: Push metadata
        if: inputs.what != 'setup'
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=("$APP_SLUG" --what "${{ inputs.what }}")
          [[ "$DRY" == "true" ]] && args+=(--dry-run)
          python3 factory/tools/asc_metadata.py "${args[@]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## App Store metadata: $APP_NAME ($APP_SLUG)"
            echo "- What: ${{ inputs.what }}"
            echo "- Dry run: ${{ inputs.dry_run }}"
            echo "- App Store Connect app: $ASC_APP_ID"
          } >> "$GITHUB_STEP_SUMMARY"
