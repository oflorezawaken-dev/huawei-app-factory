name: Factory Build

# Generic build for every app in factory/apps.json.
# - push/PR: builds only the apps whose folder changed (registry.py changed)
# - manual: builds one app, or all when the input is empty
# verify  = quality gate + unit tests + debug APK (PRs get no secrets)
# release = signed APK + AAB, main branch only, artifacts <slug>-release-apk / -aab

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'factory/**'
      - '.github/workflows/factory-build.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'factory/**'
      - '.github/workflows/factory-build.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'App slug from factory/apps.json (empty = every app)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide which apps to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ inputs.app }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ -n "$INPUT_APP" ]]; then
              slugs="$INPUT_APP"
            else
              slugs="$(python3 factory/tools/registry.py list)"
            fi
          elif [[ "$EVENT" == "pull_request" ]]; then
            slugs="$(python3 factory/tools/registry.py changed "$PR_BASE" "$PR_HEAD")"
          else
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              slugs="$(python3 factory/tools/registry.py list)"
            else
              slugs="$(python3 factory/tools/registry.py changed "$BEFORE" "$AFTER")"
            fi
            # factory/ or workflow changes without app changes: rebuild everything once
            if [[ -z "$slugs" ]]; then
              slugs="$(python3 factory/tools/registry.py list)"
            fi
          fi
          # Registered apps without an Android project yet (status: planned) are skipped.
          buildable=""
          for s in $slugs; do
            path="$(python3 factory/tools/registry.py get "$s" path)"
            if [[ -f "$path/settings.gradle.kts" ]]; then buildable="$buildable $s"; else echo "skip $s: no project at $path yet"; fi
          done
          json="$(printf '%s\n' $buildable | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Building: $json"

  verify:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Load app from registry
        run: python3 factory/tools/registry.py env "${{ matrix.app }}" >> "$GITHUB_ENV"

      - name: Quality gate
        run: python3 factory/tools/check_app.py "$APP_SLUG"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.FACTORY_JAVA_VERSION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.FACTORY_GRADLE_VERSION }}

      - name: Unit tests
        run: cd "$APP_PATH" && gradle :app:testDebugUnitTest

      - name: Debug APK
        run: cd "$APP_PATH" && gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: ${{ env.APP_PATH }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    needs: [plan, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    env:
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Load app from registry
        run: python3 factory/tools/registry.py env "${{ matrix.app }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.FACTORY_JAVA_VERSION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.FACTORY_GRADLE_VERSION }}

      - name: Materialize release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEYSTORE_PASSWORD" || -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Required release signing secrets are not configured."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/factory-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"
          echo "RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Signed release APK
        run: cd "$APP_PATH" && gradle :app:assembleRelease

      - name: Signed release AAB
        run: cd "$APP_PATH" && gradle :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_APK }}
          path: ${{ env.APP_PATH }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_AAB }}
          path: ${{ env.APP_PATH }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/factory-release.keystore"
