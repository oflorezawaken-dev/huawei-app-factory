name: Factory Publish to AppGallery

# Uploads a signed build of any registered app to AppGallery Connect and,
# only when asked, submits it for review. Manual trigger, `appgallery`
# environment. The app's AGC App ID comes from factory/apps.json.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App slug from factory/apps.json'
        required: true
        default: 'receipt-lens'
      release_run_id:
        description: 'Run ID of a successful "Factory Build" (empty = latest successful on main)'
        required: false
        default: ''
      package_type:
        description: 'Package to upload'
        required: true
        default: 'apk'
        type: choice
        options: [apk, aab]
      submit_for_review:
        description: 'Submit for review after upload (false = upload only)'
        required: true
        default: false
        type: boolean
      release_notes:
        description: 'Release notes for the reviewer (10-300 chars, required when submitting)'
        required: false
        default: ''
      allow_test_ad_units:
        description: 'Upload even if the build carries Huawei TEST ad units (upload only; never allowed with submit_for_review)'
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: factory-publish-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: appgallery
    steps:
      - uses: actions/checkout@v4

      - name: Load app from registry
        run: |
          python3 factory/tools/registry.py env "${{ inputs.app }}" >> "$GITHUB_ENV"
          if [[ -z "$(python3 factory/tools/registry.py get "${{ inputs.app }}" agc_app_id)" ]]; then
            echo "::error::factory/apps.json has no agc_app_id for ${{ inputs.app }}. Create the app in AppGallery Connect and paste its App ID into the registry."
            exit 1
          fi

      - name: Refuse to publish a build with test ad units
        env:
          ALLOW_TEST: ${{ inputs.allow_test_ad_units }}
          SUBMIT: ${{ inputs.submit_for_review }}
        run: |
          if [[ -z "$PETAL_BANNER_AD_ID" || -z "$PETAL_INTERSTITIAL_AD_ID" ]]; then
            if [[ "$SUBMIT" == "true" ]]; then
              echo "::error::Cannot submit $APP_SLUG for review: factory/apps.json has no Petal Ads unit IDs, so the build carries Huawei TEST ad units."
              exit 1
            elif [[ "$ALLOW_TEST" != "true" ]]; then
              echo "::error::factory/apps.json has no Petal Ads unit IDs for $APP_SLUG (build carries TEST ad units). Paste the IDs, or set allow_test_ad_units=true for an upload-only test."
              exit 1
            else
              echo "::warning::Uploading $APP_SLUG with Huawei TEST ad units (upload only). Rebuild and re-upload with real unit IDs before any submission."
            fi
          fi

      - name: Resolve release run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_RUN_ID" ]]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow factory-build.yml \
                       --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "::error::No successful Factory Build run found. Run 'Factory Build' for $APP_SLUG first."
            exit 1
          fi
          conclusion="$(gh run view "$run_id" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          [[ "$conclusion" == "success" ]] || { echo "::error::Run $run_id concluded with '$conclusion'."; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.package_type }}" == "aab" ]]; then artifact="$ARTIFACT_AAB"; else artifact="$ARTIFACT_APK"; fi
          gh run download "${{ steps.run.outputs.run_id }}" -R "$GITHUB_REPOSITORY" -n "$artifact" -D dist
          file="$(find dist -type f -name "*.${{ inputs.package_type }}" | head -n 1)"
          [[ -n "$file" ]] || { echo "::error::Artifact $artifact did not contain a .${{ inputs.package_type }} file (was $APP_SLUG built in run ${{ steps.run.outputs.run_id }}?)."; exit 1; }
          echo "PACKAGE_FILE=$file" >> "$GITHUB_ENV"
          ls -l "$file"

      - name: Verify APK signature
        if: inputs.package_type == 'apk'
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$PACKAGE_FILE"

      - name: Upload to AppGallery Connect
        env:
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          SUBMIT: ${{ inputs.submit_for_review }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          [[ -n "$AGC_CLIENT_ID" && -n "$AGC_CLIENT_SECRET" ]] || { echo "::error::AGC secrets not configured."; exit 1; }
          args=(--app-id "$AGC_APP_ID" --file "$PACKAGE_FILE")
          if [[ "$SUBMIT" == "true" ]]; then
            len=${#NOTES}
            (( len >= 10 && len <= 300 )) || { echo "::error::release_notes must be 10-300 chars when submitting (got $len)."; exit 1; }
            args+=(--submit --release-notes "$NOTES")
          fi
          python3 factory/tools/agc_publish.py "${args[@]}"

      - name: Summary
        run: |
          {
            echo "## AppGallery publish: $APP_NAME ($APP_SLUG)"
            echo "- Source run: ${{ steps.run.outputs.run_id }}"
            echo "- Package: \`$(basename "$PACKAGE_FILE")\`"
            echo "- Submitted for review: ${{ inputs.submit_for_review }}"
          } >> "$GITHUB_STEP_SUMMARY"
