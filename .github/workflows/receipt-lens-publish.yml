name: ReceiptLens Publish to AppGallery

# Human-gated publishing step. Never runs automatically: a person triggers it,
# picks which signed release run to publish, and decides whether to submit for
# review. Uses the `appgallery` environment so required reviewers can be
# enforced in repository settings.

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Run ID of a successful "ReceiptLens Build" workflow (leave empty = latest successful on main)'
        required: false
        default: ''
      package_type:
        description: 'Package to upload'
        required: true
        default: 'apk'
        type: choice
        options: [apk, aab]
      submit_for_review:
        description: 'Submit for review after upload (false = upload only)'
        required: true
        default: false
        type: boolean
      release_notes:
        description: 'Release notes shown to the reviewer (10-300 chars, required when submitting)'
        required: false
        default: ''
      app_id:
        description: 'AppGallery Connect App ID (overrides the RECEIPT_LENS_AGC_APP_ID repository variable). Required for the first upload, before the package name exists in AGC.'
        required: false
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: receipt-lens-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: appgallery
    env:
      PACKAGE_NAME: com.huaweiappfactory.receiptlens
      BUILD_WORKFLOW_FILE: receipt-lens-build.yml

    steps:
      - name: Checkout (factory tools only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            factory/tools
          sparse-checkout-cone-mode: false

      - name: Resolve release run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_RUN_ID" ]]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$BUILD_WORKFLOW_FILE" \
                       --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "::error::No successful release run found."
            exit 1
          fi
          conclusion="$(gh run view "$run_id" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Run $run_id concluded with '$conclusion', refusing to publish."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Publishing artifacts from run $run_id"

      - name: Download signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="receipt-lens-release-${{ inputs.package_type }}"
          gh run download "${{ steps.run.outputs.run_id }}" -R "$GITHUB_REPOSITORY" -n "$artifact" -D dist
          file="$(find dist -type f -name "*.${{ inputs.package_type }}" | head -n 1)"
          if [[ -z "$file" ]]; then
            echo "::error::Artifact $artifact did not contain a .${{ inputs.package_type }} file."
            exit 1
          fi
          echo "PACKAGE_FILE=$file" >> "$GITHUB_ENV"
          ls -l "$file"

      - name: Verify APK signature
        if: inputs.package_type == 'apk'
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$PACKAGE_FILE"

      - name: Validate release notes
        env:
          SUBMIT: ${{ inputs.submit_for_review }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [[ "$SUBMIT" == "true" ]]; then
            len=${#NOTES}
            if (( len < 10 || len > 300 )); then
              echo "::error::release_notes must be 10-300 characters when submitting (got $len)."
              exit 1
            fi
          fi

      - name: Upload to AppGallery Connect
        env:
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          SUBMIT: ${{ inputs.submit_for_review }}
          NOTES: ${{ inputs.release_notes }}
          APP_ID: ${{ inputs.app_id != '' && inputs.app_id || vars.RECEIPT_LENS_AGC_APP_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$AGC_CLIENT_ID" || -z "$AGC_CLIENT_SECRET" ]]; then
            echo "::error::AGC_CLIENT_ID / AGC_CLIENT_SECRET secrets are not configured."
            exit 1
          fi
          # AGC assigns the package name on the first uploaded package, so the
          # package-name lookup only works after that. Prefer the explicit App ID.
          if [[ -n "$APP_ID" ]]; then
            args=(--app-id "$APP_ID" --file "$PACKAGE_FILE")
          else
            args=(--package-name "$PACKAGE_NAME" --file "$PACKAGE_FILE")
          fi
          if [[ "$SUBMIT" == "true" ]]; then
            args+=(--submit --release-notes "$NOTES")
          fi
          python3 factory/tools/agc_publish.py "${args[@]}"

      - name: Summary
        run: |
          {
            echo "## AppGallery publish"
            echo ""
            echo "- Source run: ${{ steps.run.outputs.run_id }}"
            echo "- Package: \`$(basename "$PACKAGE_FILE")\`"
            echo "- Submitted for review: ${{ inputs.submit_for_review }}"
          } >> "$GITHUB_STEP_SUMMARY"
