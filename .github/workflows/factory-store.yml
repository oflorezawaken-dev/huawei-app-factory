name: Factory Store Setup

# Pushes store metadata for any registered app to AppGallery Connect:
# listing text (all languages), icon, screenshots, and app-info fields such
# as the privacy policy URL. Each part can be run alone. Manual trigger,
# `appgallery` environment.
# `privacy-tags` has no API: it validates store/privacy-tags.json and prints the
# console checklist in the run summary for the human to copy.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App slug from factory/apps.json'
        required: true
        default: 'receipt-lens'
      what:
        description: 'What to push'
        required: true
        default: 'all'
        type: choice
        options: [all, listing, icon, screenshots, app-info, app-config, privacy-label, privacy-tags]
      lang:
        description: 'Screenshots/icon: folder under store/screenshots (en, es, ...), empty = every folder. Listing: AGC code (en-US), empty = all.'
        required: false
        default: ''
      app_info_fields:
        description: 'app-info: comma-separated KEY=VALUE (empty = privacyPolicy from registry privacy_path)'
        required: false
        default: ''
      dry_run:
        description: 'Print what would be sent without calling AppGallery Connect'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  store:
    runs-on: ubuntu-latest
    environment: appgallery
    env:
      AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
      AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
      DRY: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Load app from registry
        run: |
          python3 factory/tools/registry.py env "${{ inputs.app }}" >> "$GITHUB_ENV"
          if [[ -z "$(python3 factory/tools/registry.py get "${{ inputs.app }}" agc_app_id)" ]]; then
            echo "::error::factory/apps.json has no agc_app_id for ${{ inputs.app }}."
            exit 1
          fi
          echo "PRIVACY_URL=$(python3 -c "import json;print(json.load(open('factory/apps.json'))['defaults']['privacy_base_url'])")/$(python3 factory/tools/registry.py get "${{ inputs.app }}" privacy_path | sed 's#^docs/##')/" >> "$GITHUB_ENV"

      - name: Listing text
        if: inputs.what == 'all' || inputs.what == 'listing'
        run: |
          set -euo pipefail
          args=(--app-id "$AGC_APP_ID" --listing "$APP_STORE_DIR/listing.json")
          if [[ -n "${{ inputs.lang }}" ]]; then args+=(--lang "${{ inputs.lang }}"); else args+=(--all); fi
          [[ "$DRY" == "true" ]] && args+=(--dry-run)
          python3 factory/tools/agc_update_listing.py "${args[@]}"

      - name: Icon
        if: inputs.what == 'all' || inputs.what == 'icon'
        run: |
          set -euo pipefail
          # AGC requires a lang even for the icon (the icon file itself is the same for
          # every language). `lang` means the same thing here as it does for screenshots
          # -- a folder name -- so one dispatch can carry both without the caller having
          # to remember which step wants "es" and which wants "es-ES".
          # Empty means every language, the same as it already does for the listing:
          # a store page whose icon is set only in English shows nothing in the other
          # eight, and nobody remembers to run this nine times.
          folders="${{ inputs.lang }}"
          [[ -n "$folders" ]] || folders="$(ls "$APP_STORE_DIR/screenshots")"
          for folder in $folders; do
            lang="$(python3 factory/tools/registry.py agc-lang "$folder")"
            args=(--app-id "$AGC_APP_ID" --file-type icon --lang "$lang" --file "$APP_STORE_DIR/icon/icon-512.png")
            [[ "$DRY" == "true" ]] && args+=(--dry-run)
            python3 factory/tools/agc_upload_assets.py "${args[@]}"
          done

      - name: Screenshots
        if: inputs.what == 'all' || inputs.what == 'screenshots'
        run: |
          set -euo pipefail
          folders="${{ inputs.lang }}"
          [[ -n "$folders" ]] || folders="$(ls "$APP_STORE_DIR/screenshots")"
          for folder in $folders; do
            dir="$APP_STORE_DIR/screenshots/$folder"
            [[ -d "$dir" ]] || { echo "::error::No screenshots at $dir"; exit 1; }
            agc_lang="$(python3 factory/tools/registry.py agc-lang "$folder")"
            args=(--app-id "$AGC_APP_ID" --file-type screenshot --lang "$agc_lang")
            for f in "$dir"/*.png; do args+=(--file "$f"); done
            [[ "$DRY" == "true" ]] && args+=(--dry-run)
            python3 factory/tools/agc_upload_assets.py "${args[@]}"
          done

      - name: App info
        if: inputs.what == 'all' || inputs.what == 'app-info'
        env:
          FIELDS: ${{ inputs.app_info_fields }}
        run: |
          set -euo pipefail
          args=(--app-id "$AGC_APP_ID")
          if [[ -n "$FIELDS" ]]; then
            IFS=',' read -ra PAIRS <<< "$FIELDS"
            for pair in "${PAIRS[@]}"; do args+=(--set "$pair"); done
          else
            args+=(--set "privacyPolicy=$PRIVACY_URL")
          fi
          [[ "$DRY" == "true" ]] && args+=(--dry-run)
          python3 factory/tools/agc_update_app_info.py "${args[@]}"

      - name: App config (distribution countries and category)
        if: inputs.what == 'app-config'
        run: |
          set -euo pipefail
          # Two console steps that do have an API. Run this BEFORE the first
          # submission: a PUT to app-info on a released app opens a draft version
          # even when nothing changes.
          args=(--app-id "$AGC_APP_ID"
                --from-registry "$APP_SLUG"
                --set "privacyPolicy=$PRIVACY_URL")
          [[ "$DRY" == "true" ]] && args+=(--dry-run)
          python3 factory/tools/agc_update_app_info.py "${args[@]}"

      - name: Privacy label (the console's privacy tags, as data)
        if: inputs.what == 'privacy-label'
        run: |
          set -euo pipefail
          # app-info returns privacyLabel, so it may also accept it. If it does,
          # the one console step that has rejected an app in this factory stops
          # being a console step. The payload is the declaration AppGallery
          # already approved for HabitCue, not a reconstruction.
          python3 -c "import sys; sys.path.insert(0, 'factory/tools'); from privacy_tags import petal_ads_label_json; print(petal_ads_label_json())" > /tmp/privacy-label.json
          echo "payload: $(cat /tmp/privacy-label.json)"
          args=(--app-id "$AGC_APP_ID"
                --set "privacyPolicy=$PRIVACY_URL"
                --set-file "privacyLabel=/tmp/privacy-label.json")
          [[ "$DRY" == "true" ]] && args+=(--dry-run)
          python3 factory/tools/agc_update_app_info.py "${args[@]}"

      - name: Privacy tags checklist (manual console step, no API)
        if: inputs.what == 'all' || inputs.what == 'privacy-tags'
        run: |
          set -euo pipefail
          python3 factory/tools/privacy_tags.py check "$APP_SLUG"
          {
            echo "> Copy this into AppGallery Connect. Then write today's date in factory/apps.json -> privacy_tags_configured."
            echo "> Registry currently says: ${PRIVACY_TAGS_CONFIGURED:-NOT YET CONFIGURED}"
            echo
            python3 factory/tools/privacy_tags.py render "$APP_SLUG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Store setup: $APP_NAME ($APP_SLUG)"
            echo "- What: ${{ inputs.what }}"
            echo "- Lang: ${{ inputs.lang || 'default/all' }}"
            echo "- Dry run: ${{ inputs.dry_run }}"
          } >> "$GITHUB_STEP_SUMMARY"
