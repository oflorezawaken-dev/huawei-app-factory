name: Factory iOS Publish to App Store Connect

# Uploads a signed IPA of a registered iOS app to App Store Connect and, only
# when asked, submits it for review. Manual trigger, `appstore` environment.
# Runs on macos-latest because both altool and codesign are macOS-only tools.
#
# NOTE ON submit_for_review: the review-submission API call
# (reviewSubmissions -> reviewSubmissionItems -> submitted:true, implemented in
# factory/tools/asc_publish.py) has been tested against a local mock server,
# not against a live Apple account. Treat the first real submission as a
# supervised run: watch it complete, don't fire-and-forget it.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'iOS app slug from factory/apps.json'
        required: true
      release_run_id:
        description: 'Run ID of a successful "Factory iOS Build" (empty = latest successful on main)'
        required: false
        default: ''
      submit_for_review:
        description: 'Submit for review after upload (false = upload only)'
        required: true
        default: false
        type: boolean
      release_notes:
        description: "What's New text for the reviewer (10-300 chars, required when submitting)"
        required: false
        default: ''
      allow_test_ad_ids:
        description: 'Upload even if the build carries AdMob TEST unit IDs (upload only; never allowed with submit_for_review)'
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: factory-ios-publish-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    environment: appstore
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Load app from registry
        env:
          # Ad unit IDs live in repo variables, not in git (factory rule 5).
          FACTORY_VARS: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          python3 factory/tools/registry.py env "${{ inputs.app }}" >> "$GITHUB_ENV"
          if [[ -z "$(python3 factory/tools/registry.py get "${{ inputs.app }}" asc_app_id)" ]]; then
            echo "::error::factory/apps.json has no asc_app_id for ${{ inputs.app }}. Create the app in App Store Connect and paste its numeric Apple ID into the registry."
            exit 1
          fi

      - name: Confirm signing credentials are configured
        run: |
          [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY_P8" ]] || {
            echo "::error::ASC_KEY_ID/ASC_ISSUER_ID/ASC_PRIVATE_KEY_P8 are not configured in the appstore environment."
            exit 1
          }

      - name: Refuse to publish a build with test AdMob IDs
        env:
          ALLOW_TEST: ${{ inputs.allow_test_ad_ids }}
          SUBMIT: ${{ inputs.submit_for_review }}
        run: |
          set -euo pipefail
          prefix="$(python3 -c "import json; print(json.load(open('factory/apps.json'))['defaults']['ios']['admob_test_id_prefix'])")"
          using_test=false
          for id in "$ADMOB_APP_ID" "$ADMOB_BANNER_UNIT_ID" "$ADMOB_INTERSTITIAL_UNIT_ID"; do
            [[ -z "$id" || "$id" == "$prefix"* ]] && using_test=true
          done
          if [[ "$using_test" == "true" ]]; then
            if [[ "$SUBMIT" == "true" ]]; then
              echo "::error::Cannot submit $APP_SLUG for review: factory/apps.json has no real AdMob unit IDs (or they still match Google's test prefix)."
              exit 1
            elif [[ "$ALLOW_TEST" != "true" ]]; then
              echo "::error::factory/apps.json has test/empty AdMob unit IDs for $APP_SLUG. Paste real IDs, or set allow_test_ad_ids=true for an upload-only test."
              exit 1
            else
              echo "::warning::Uploading $APP_SLUG with test AdMob IDs (upload only). Rebuild with real unit IDs before any submission."
            fi
          fi

      - name: Quality gate (strict)
        if: inputs.submit_for_review == 'true'
        run: python3 factory/tools/check_ios_app.py "$APP_SLUG" --strict

      - name: Resolve release run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_RUN_ID" ]]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow factory-ios-build.yml \
                       --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo "::error::No successful Factory iOS Build run found. Run 'Factory iOS Build' for $APP_SLUG first."
            exit 1
          fi
          conclusion="$(gh run view "$run_id" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          [[ "$conclusion" == "success" ]] || { echo "::error::Run $run_id concluded with '$conclusion'."; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download signed IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.run.outputs.run_id }}" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT_IPA" -D dist
          file="$(find dist -type f -name '*.ipa' | head -n 1)"
          [[ -n "$file" ]] || { echo "::error::Artifact $ARTIFACT_IPA did not contain an .ipa file (was $APP_SLUG built in run ${{ steps.run.outputs.run_id }}?)."; exit 1; }
          echo "IPA_FILE=$file" >> "$GITHUB_ENV"
          ls -l "$file"

      - name: Verify IPA signature
        run: |
          set -euo pipefail
          rm -rf /tmp/ipa-check && unzip -q "$IPA_FILE" -d /tmp/ipa-check
          codesign -dv --verbose=4 /tmp/ipa-check/Payload/*.app

      - name: Upload (and optionally submit)
        env:
          SUBMIT: ${{ inputs.submit_for_review }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          args=("$APP_SLUG" --ipa "$IPA_FILE" --wait)
          if [[ "$SUBMIT" == "true" ]]; then
            # Optional: a first version cannot carry What's New at all.
            if [[ -n "$NOTES" ]]; then
              len=${#NOTES}
              (( len >= 10 && len <= 300 )) || { echo "::error::release_notes must be 10-300 chars when given (got $len)."; exit 1; }
              args+=(--notes "$NOTES")
            fi
            args+=(--attach --submit)
          else
            args+=(--attach)
          fi
          python3 factory/tools/asc_publish.py "${args[@]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## App Store publish: $APP_NAME ($APP_SLUG)"
            echo "- Source run: ${{ steps.run.outputs.run_id }}"
            echo "- Package: \`$(basename "$IPA_FILE")\`"
            echo "- Submitted for review: ${{ inputs.submit_for_review }}"
          } >> "$GITHUB_STEP_SUMMARY"
